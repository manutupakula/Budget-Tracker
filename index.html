<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-left">
      <h1 class="hdr-title"><span>Budget</span> Tracker</h1>
      <p class="hdr-sub">Personal finance dashboard · All data saved locally</p>
    </div>
    <div class="hdr-right">
      <div class="hdr-date" id="hdr-date"></div>
      <!-- THEME TOGGLE -->
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
        <span class="toggle-icon sun">☀️</span>
        <span class="toggle-icon moon">🌙</span>
      </button>
    </div>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="cards">
    <div class="card balance">
      <div class="card-icon">⚖️</div>
      <div class="card-lbl">Net Balance</div>
      <div class="card-val" id="card-balance">₹0.00</div>
      <div class="card-bar"></div>
    </div>
    <div class="card income">
      <div class="card-icon">↑</div>
      <div class="card-lbl">Total Income</div>
      <div class="card-val" id="card-income">₹0.00</div>
      <div class="card-bar"></div>
    </div>
    <div class="card expense">
      <div class="card-icon">↓</div>
      <div class="card-lbl">Total Expenses</div>
      <div class="card-val" id="card-expense">₹0.00</div>
      <div class="card-bar"></div>
    </div>
  </div>

  <!-- CHARTS ROW -->
  <div class="charts-row">
    <div class="chart-box">
      <h3>Income vs Expense</h3>
      <div class="chart-wrap"><canvas id="donut-chart"></canvas></div>
      <div class="legend" id="donut-legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div><span id="leg-income">Income ₹0.00</span></div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div><span id="leg-expense">Expense ₹0.00</span></div>
      </div>
    </div>
    <div class="chart-box">
      <h3>Monthly Overview</h3>
      <div class="chart-wrap"><canvas id="bar-chart"></canvas></div>
      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Income</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div>Expense</div>
      </div>
    </div>
  </div>

  <!-- CATEGORY BREAKDOWN -->
  <div class="chart-box cat-breakdown" id="cat-section" style="display:none;margin-bottom:20px;">
    <h3>Expense by Category</h3>
    <div class="cat-table" id="cat-table"></div>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <h2>Add Transaction</h2>
    <div class="field full">
      <label>Description</label>
      <input type="text" id="desc" placeholder="e.g. Monthly Salary, Grocery Shopping..." maxlength="50"/>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="category"></select>
      </div>
      <div class="field">
        <label>Type</label>
        <div class="type-row">
          <button class="t-btn inc" id="btn-income" onclick="setType('income')">↑ Income</button>
          <button class="t-btn exp on" id="btn-expense" onclick="setType('expense')">↓ Expense</button>
        </div>
      </div>
    </div>
    <button class="add-btn" onclick="addTransaction()">＋ Add Transaction</button>
  </div>

  <!-- TRANSACTION LIST -->
  <div class="toolbar">
    <button class="fb on" onclick="setFilter('all', this)">All</button>
    <button class="fb" onclick="setFilter('income', this)">Income</button>
    <button class="fb" onclick="setFilter('expense', this)">Expense</button>
    <span class="txn-ct" id="txn-count">0 entries</span>
    <button class="clr-btn" id="clear-btn" onclick="clearAll()" style="display:none">🗑 Clear All</button>
  </div>

  <h2 class="section-title">Transactions</h2>
  <div class="txn-list" id="txn-list"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
